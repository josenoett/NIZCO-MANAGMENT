name: Respaldo diario de la base de datos (Supabase → Google Drive)

on:
  schedule:
    # 09:00 UTC = 03:00 hora de Ciudad Juárez (UTC-6)
    - cron: "0 9 * * *"
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña "Actions"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar herramientas (postgresql-client 17 + rclone)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget ca-certificates gnupg lsb-release

          # el repo de Ubuntu trae pg_dump 16, pero Supabase corre Postgres 17,
          # así que agregamos el repositorio oficial de PostgreSQL (PGDG) para
          # instalar la versión 17 del cliente y evitar el "server version mismatch"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget --quiet -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Generar el respaldo (pg_dump)
        env:
          PGCONNECT_TIMEOUT: "30"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H%M")UTC
          FILENAME="befix_backup_${TIMESTAMP}.sql.gz"
          echo "FILENAME=${FILENAME}" >> "$GITHUB_ENV"

          # quita espacios/saltos de línea accidentales al pegar el secreto
          DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n ')

          # usamos la ruta explícita a los binarios de Postgres 17 (instalados en
          # el paso anterior) porque el sistema puede seguir resolviendo
          # "pg_dump"/"pg_isready" sin ruta hacia la versión 16 preinstalada
          PG_BIN=/usr/lib/postgresql/17/bin
          echo "Versión de pg_dump en uso:"
          "$PG_BIN/pg_dump" --version

          echo "Probando conexión..."
          if ! "$PG_BIN/pg_isready" -d "$DB_URL"; then
            echo "::error::No se pudo conectar a la base de datos. Revisa que SUPABASE_DB_URL sea correcta y que la contraseña esté URL-encoded (@ → %40, # → %23, etc.)."
            exit 1
          fi

          "$PG_BIN/pg_dump" "$DB_URL" \
            --no-owner --no-privileges --format=plain \
            | gzip -9 > "${FILENAME}"

          ls -lh "${FILENAME}"

      - name: Configurar rclone (tu cuenta de Google, vía OAuth)
        env:
          GDRIVE_RCLONE_TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive
          root_folder_id = ${GDRIVE_FOLDER_ID}
          client_id = ${GDRIVE_CLIENT_ID}
          client_secret = ${GDRIVE_CLIENT_SECRET}
          token = ${GDRIVE_RCLONE_TOKEN}
          EOF

      - name: Subir respaldo a Google Drive
        run: |
          rclone copy "${FILENAME}" "gdrive:" -v

      - name: Borrar respaldos con más de 30 días (retención)
        run: |
          rclone delete "gdrive:" --min-age 30d -v

      - name: Verificación rápida
        run: |
          echo "Respaldo '${FILENAME}' subido correctamente a Google Drive."
          echo "Se conservan los últimos 30 días de respaldos en la carpeta configurada."
